notes: >-
  Sami Hani Badaoui and Sarah Ellen Mary Vaughan extend Dharunish
  Yugeswardeenoo's degree-16 diameter-5 graph of order 159744 by
  adding 7936 false-twin vertices selected with disjoint original
  neighbourhoods, obtaining maximum degree 17 and diameter five.
  The new graph is reconstructed from 624 Hamming H(4,4) fibres,
  159744 four-vertex line partners forming 79872 K4,4 subgraphs,
  and a list of 7936 clone sources. The line-partner involution,
  degree bound and graph diameter are checked from scratch by the
  C++17 verifier; a complete BFS runs from every vertex.
  The original construction was found through AI-assisted computational
  exploration and independently checked with both source reconstruction
  and exhaustive BFS. No prior journal publication is claimed.
